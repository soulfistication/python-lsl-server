[project]
name = "pylsl-server"
version = "0.1.0"
description = "Listen for Lab Streaming Layer events advertised on the local network."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pylsl>=1.16.2"]

[project.scripts]
lsl-server = "lsl_server.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lsl_server"]
